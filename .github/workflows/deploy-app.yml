name: Deploy Customer App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-customer-app-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Customer App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install

      - name: Build
        run: NODE_ENV=production npm run build
        env:
          NEXT_PUBLIC_APP_NAME: PLUTO
          NEXT_PUBLIC_APP_URL: https://plutobooking.com
          NEXT_PUBLIC_API_URL: https://api.plutobooking.com/api/v1
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy-build-key
          NEXT_PUBLIC_ENABLE_PARTNER_REGISTRATION: "true"
          NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN: "true"

  deploy:
    name: Deploy Customer App
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          script: |
            set -euo pipefail

            cd /var/www/pluto/app/app
            git fetch origin main
            git reset --hard origin/main

            npm install
            rm -rf .next
            NODE_ENV=production npm run build

            pm2 reload pluto-app --update-env || NODE_ENV=production pm2 start "npm run start" --name pluto-app
            pm2 save

            sleep 5
            curl -fsS http://127.0.0.1:4000 >/dev/null
            curl -fsS https://plutobooking.com >/dev/null