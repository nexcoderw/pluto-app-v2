name: Deploy Customer App

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-customer-app-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Customer App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout App
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm install

      - name: Build
        run: NODE_ENV=production npm run build
        env:
          NEXT_PUBLIC_APP_NAME: PLUTO
          NEXT_PUBLIC_APP_URL: https://www.plutobooking.com
          NEXT_PUBLIC_API_URL: https://api.plutobooking.com/api/v1
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: dummy-build-key
          NEXT_PUBLIC_ENABLE_PARTNER_REGISTRATION: "true"
          NEXT_PUBLIC_ENABLE_GOOGLE_LOGIN: "true"
          NEXT_PUBLIC_XENTRIPAY_COLLECTION_FEE_BPS: "0"
          NEXT_PUBLIC_PAYMENT_TAX_BPS: "0"

  deploy:
    name: Deploy Customer App
    runs-on: ubuntu-latest
    needs: validate
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            (
              flock -w 900 9 || {
                echo "Timed out waiting for another Pluto deployment to finish."
                exit 1
              }

              cd /var/www/pluto/app/app
              git remote set-url origin git@github.com:nexcoderw/pluto-app-v2.git
              git fetch origin main
              git reset --hard origin/main

              npm install
              rm -rf .next

              unset NEXT_PUBLIC_XENTRIPAY_COLLECTION_FEE_BPS NEXT_PUBLIC_PAYMENT_TAX_BPS
              set -a
              . ./.env.production
              set +a

              : "${NEXT_PUBLIC_XENTRIPAY_COLLECTION_FEE_BPS:?NEXT_PUBLIC_XENTRIPAY_COLLECTION_FEE_BPS is required}"
              : "${NEXT_PUBLIC_PAYMENT_TAX_BPS:?NEXT_PUBLIC_PAYMENT_TAX_BPS is required}"

              NODE_ENV=production npm run build

              pm2 reload pluto-app --update-env || NODE_ENV=production pm2 start "npm run start" --name pluto-app

              for attempt in {1..15}; do
                if curl -fsS --max-time 5 http://127.0.0.1:4000 >/dev/null; then
                  break
                fi

                if [ "$attempt" -eq 15 ]; then
                  echo "Pluto customer app did not become ready after 15 health-check attempts."
                  pm2 logs pluto-app --lines 80 --nostream
                  exit 1
                fi

                sleep 2
              done

              curl -fsS --max-time 10 https://www.plutobooking.com >/dev/null

              pm2 save
              chmod 600 "$HOME/.pm2/dump.pm2"
            ) 9>/tmp/pluto-deploy.lock
